[package]
name = "web"
version = "0.1.0"
edition = "2021"
description = "Dioxus LiveView Web UI for omenic"
license = "MIT"
publish = false

[dependencies]
dioxus = { version = "0.7", features = ["liveview"] }
dioxus-liveview = { version = "0.7", features = ["axum"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
config = { path = "../../infra/config" }
adaptor = { path = "../../agent/adaptor" }
orbit = { path = "../../agent/orbit" }
tools = { path = "../../agent/tools" }
memory = { path = "../../infra/memory" }
session = { path = "../../infra/session" }
task = { path = "../../agent/task" }
pulldown-cmark.workspace = true
dioxus_components = "0.1.2"

[dev-dependencies]
tempfile = { workspace = true }
