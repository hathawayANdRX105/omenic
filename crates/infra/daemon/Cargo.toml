[package]
name = "daemon"
version = "0.1.0"
edition = "2024"
description = "Headless omenic daemon: JSONL socket protocol, single-instance lifecycle, persistent session/run state"
license = "MIT"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
fs2 = { workspace = true }
adaptor = { path = "../../agent/adaptor" }
orbit = { path = "../../agent/orbit" }
rpc = { path = "../rpc" }
session = { path = "../session" }
config = { path = "../config" }
omenic-composition = { path = "../../composition" }
omenic-harness-tools = { path = "../../harness/tools" }
omenic-harness-compaction = { path = "../../harness/compaction" }
omenic-harness-runtime = { path = "../../harness/runtime" }
omenic-harness-subagent = { path = "../../harness/subagent" }
tools = { path = "../../agent/tools" }
parking_lot = "0.12"
ctrlc = { workspace = true, features = ["termination"] }

[dev-dependencies]
tempfile = { workspace = true }
libc = "0.2"
omenic-harness-subagent = { path = "../../harness/subagent" }