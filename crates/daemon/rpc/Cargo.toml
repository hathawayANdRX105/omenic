[package]
name = "rpc"
version = "0.1.0"
edition = "2024"
description = "omp --mode rpc stdio JSONL client"
license = "MIT"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
libc = "0.2"
llm = { path = "../../llm" }
orbit = { path = "../../agent/orbit" }
tools = { path = "../../tools" }
session = { path = "../../session" }
protocol = { path = "../../protocol" }
tools-harness = { path = "../../tools/harness" }
compaction = { path = "../../agent-loop/compaction" }

[dev-dependencies]
tempfile = { workspace = true }
composition = { path = "../../plugin/composition" }
agent-loop = { path = "../../agent-loop" }
