[package]
name = "tui"
version = "0.1.0"
edition = "2024"
description = "Terminal chat UI with streaming LLM responses"
license = "MIT"
publish = false

[lib]
name = "tui"
path = "src/lib.rs"

[dependencies]
adaptor = { path = "../adaptor" }
config = { path = "../config" }
ratatui = { workspace = true }
crossterm = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
fs2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }