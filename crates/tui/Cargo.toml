[package]
name = "tui"
version = "0.1.0"
edition = "2024"
description = "Terminal chat UI with streaming LLM responses"
license = "MIT"
publish = false

[lib]
name = "tui"
path = "src/lib.rs"

[[bin]]
name = "tui"
path = "src/main.rs"

[dependencies]
adaptor = { path = "../adaptor" }
ratatui = { workspace = true }
crossterm = { workspace = true }
pulldown-cmark = { workspace = true }
serde_json = { workspace = true }
