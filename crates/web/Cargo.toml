[package]
name = "web"
version = "0.1.0"
edition = "2021"
description = "Dioxus fullstack Web UI for omenic"
license = "MIT"
publish = false

[dependencies]
dioxus = { version = "0.6", features = ["fullstack", "router"] }
serde = { workspace = true }
serde_json = { workspace = true }
config = { path = "../config" }
task = { path = "../task" }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server"]
