# TUI Spec: 会话列表屏幕
# agent 用 ratatui TestBackend 渲染后断言 buffer cell
# 参考 OMP skill `ui-validate` 了解完整流程

screen: "会话列表"
size: "80x24"

asserts:
  - at: [5, 3]
    contains: "会话列表"
  - at: [10, 8]
    contains: "新会话"
  - focus: "Sessions"
  - state:
      active_session: 0
      streaming: false

actions:
  - key: "Tab"
    expect_focus: "Input"
  - key: "n"
    expect_navigate: "新会话"
