name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (ripgrep for tools tests)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        # --no-fail-fast + per-test-binary output so a hang shows which
        # binary stalled instead of the whole step going dark. The timeout
        # stops a hung binary from burning the whole job budget.
        run: cargo test --locked --all-targets --no-fail-fast -- --test-threads=2
        timeout-minutes: 25
      - name: Format check
        run: cargo fmt --all -- --check
