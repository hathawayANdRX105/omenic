# Label 规则配置 — validate_issue.sh / validate_pr.sh 读取
# 维护：增删 label 或修改关键字建议只需改本文件，无需改脚本。
# 缺失本文件时脚本 fallback 到硬编码默认（不阻塞）。
#
# 字段说明：
#   type_labels       类型 label 集合（issue/PR 至少一个，I-21/P-14 强制）
#   priority_labels   优先级 label（可选，仅声明，不强检）
#   module_labels     模块 label（可选，仅声明，不强检）
#   keyword_suggest   关键字 → 建议 label（WARN 级辅助；issue 标题/body 命中关键字
#                     但缺对应 label 时提示；不阻塞）

type_labels: [bug, enhancement, chore, docs, refactor, test]

# 优先级（仅声明，脚本不强检；供人类或未来扩展使用）
priority_labels: [P0, P1, P2]

# 模块（仅声明；建议在 PR labeler 自动化时使用）
module_labels: [cli, store, graph, runner, rpc, compliance, config, worker]

# 关键字 → 建议 label：key 是 label 名，value 是中英关键字列表
keyword_suggest:
  bug:         [崩溃, panic, 报错, 异常, 错误, 修复, 失败, 重现, bug, crash, error]
  enhancement: [新增, 添加, 支持, 实现, 集成, 引入, add, support, implement, introduce]
  docs:        [文档, 说明, readme, 文档补充, docs, documentation]
  refactor:    [重构, 整理, 优化, 清理, refactor, cleanup, reorganize]
  test:        [测试, 单测, e2e, 验证脚本, test, tests, coverage]
  chore:       [合规, 脚本, 工具, 配置, 门禁, 校验, chore, tooling, config]
