[package]
name = "web"
version = "0.1.0"
edition = "2024"
description = "oi-web — Dioxus LiveView 壳入口（App/launch 在 src/app.rs；组件/页面/状态在 crates/web/）"
license = "MIT"
build = "build.rs"

[[bin]]
name = "oi-web"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["liveview"] }
dioxus-liveview = { version = "0.7", features = ["axum"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
web-client = { path = "../../crates/web-client" }
web-page-workspace = { path = "../../crates/web-page-workspace" }

# 仅测试用：解析 specs/ui/*.yaml 契约（见 tests/ui_contract.rs）
[dev-dependencies]
serde_yaml = { workspace = true }
