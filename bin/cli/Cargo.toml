[package]
name = "cli"
version = "0.1.0"
edition = "2024"
description = "Task-driven agent orchestrator CLI"
license = "MIT"

[[bin]]
name = "oi"
path = "src/main.rs"

[dependencies]
adaptor = { path = "../../crates/adaptor" }
orbit = { path = "../../crates/orbit" }
tools = { path = "../../crates/tools" }
rpc = { path = "../../crates/rpc" }
task = { path = "../../crates/task" }
spec = { path = "../../crates/spec" }
config = { path = "../../crates/config" }
tui = { path = "../tui" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
[dev-dependencies]
tempfile = { workspace = true }
