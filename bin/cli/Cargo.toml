[package]
name = "cli"
version = "0.1.0"
edition = "2024"
description = "Task-driven agent orchestrator CLI"
license = "MIT"

[[bin]]
name = "oi"
path = "src/main.rs"

[dependencies]
adaptor = { path = "../../crates/agent/adaptor" }
orbit = { path = "../../crates/agent/orbit" }
tools = { path = "../../crates/agent/tools" }
rpc = { path = "../../crates/infra/rpc" }
task = { path = "../../crates/agent/task" }
spec = { path = "../../crates/evidence/spec" }
config = { path = "../../crates/infra/config" }

subagent = { path = "../../crates/agent/subagent" }
mcp = { path = "../../crates/agent/mcp" }
daemon = { path = "../../crates/infra/daemon" }
session = { path = "../../crates/infra/session" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
[dev-dependencies]
tempfile = { workspace = true }
