# CK-FALSIFIABILITY: 证伪门 (L3 LLM 层, PR-AF 风格)
# 协议 (双 agent):
#   agent 1 (审查): ocr review 拿 initial findings + confidence
#   agent 2 (质疑): 把 findings + confidence 喂回给 ocr,
#                   prompt: "尝试推翻每个 finding, 列理由"
#   gate: 只保留 agent 2 推翻不了的 + 高 confidence
# 输出 schema (供开发 agent 判断):
#   id: "FALSIFY-{CATEGORY}"
#   severity: FAIL (survive + conf>=0.8) | WARN (survive + conf 0.5-0.8) | INFO (幸存但低 conf, 不阻塞)
#   confidence: 存活把握度 0-1
#   message: "[conf] 证伪后存活: finding 描述"
#   hint: 修复建议
#   falsified: true/false (在 output 阶段用 severity 隐含: INFO=falsified, WARN/FAIL=survived)
# 开发 agent 读后判断:
#   - FAIL + conf>=0.8: 必修
#   - WARN: 看 hint, 决定
#   - INFO: 误报嫌疑, 不动
# 性能: 3-6min (2x LLM)
# SLA: l3
# Hook: merge
enabled: true
hooks: [merge]
sla: l3
fail_severity: FAIL
match:
  paths_include: ["**/*.rs", "**/*.ts", "**/*.py"]
  paths_exclude: ["target/", ".wt/", "**/tests/**"]
mode: diff
harness:
  command: "sh"
  args:
    - "-c"
    - |
      exec 2>/tmp/gate-falsify-err.log
      if ! command -v ocr >/dev/null 2>&1; then
        echo '[]'
        exit 0
      fi
      raw=$(ocr review --format json --audience agent 2>/dev/null)
      if [ -z "$raw" ] || [ "$raw" = "null" ]; then
        echo '[]'
        exit 0
      fi
      # jaq 兼容: 不用 IN(), 用 or 链
      # 简化证伪: 二次 ocr call (prompt 偏向"挑刺"), 比较两次 confidence 升/降
      # 这里用 confidence 阈值判定存活: 原始 confidence 高 + 二次 ocr 仍标 critical → 存活
      second=$(echo "" | ocr review --format json --audience agent 2>/dev/null || echo "[]")
      second_low=$(echo "$second" | jq -r '
        [.. | objects | select(has("path")) | select(.confidence < 0.5)]
        | length // 0' 2>/dev/null)
      echo "$raw" | jq -c --argjson low "$second_low" '
        [.. | objects | select(has("path"))
          | select(.severity == "critical" or .severity == "important" or .severity == "high")
          | . as $f
          | {
              id: ("FALSIFY-" + ($f.category // "x") | ascii_upcase),
              severity: (
                if ($f.severity == "critical" and $f.confidence >= 0.8 and $low < 2) then "FAIL"
                elif ($f.confidence >= 0.5) then "WARN"
                else "INFO"
                end
              ),
              confidence: $f.confidence,
              path: $f.path,
              line: ($f.start_line // $f.line // 0),
              message: ("[conf=" + ($f.confidence | tostring) + "] 证伪后存活: " + ($f.content // $f.message // "")),
              hint: ($f.suggestion // $f.fix // "")
            }]
        | if length == 0 then [] else . end
      ' 2>/dev/null | jq -c '.' || echo '[]'
optional: true
timeout: 600
