# CK-FALSIFIABILITY: 证伪门 (L3 LLM 层)
# 思路 (PR-AF 风格): 给 LLM 初始 finding, 让它尝试推翻自己 (falsifiability gate)
# 实现: 两次 LLM 调用
#   1. 初始: ocr review 拿 findings
#   2. 证伪: 把每个 finding 喂给 LLM, 问 "is this real? try to find a counter-argument"
#   3. 只保留证伪失败的 finding (LLM 推不翻 = 真实问题)
# 性能: 3-6min (2x LLM)
# SLA: l3
# Hook: merge
# 注意: 这是一个 wrapper, 把 ocr 输出的 finding 过滤一遍再发布
#       本质是 ocr_review 的"严格"变体
enabled: true
hooks: [merge]
sla: l3
fail_severity: FAIL
match:
  paths_include: ["**/*.rs", "**/*.ts", "**/*.py"]
  paths_exclude: ["target/", ".wt/", "**/tests/**"]
mode: diff
harness:
  command: "sh"
  args:
    - "-c"
    - |
      if ! command -v ocr >/dev/null 2>&1; then
        echo '[]'
        exit 0
      fi
      # 步骤 1: 拿初始 findings
      raw=$(ocr review --format json --audience agent 2>/dev/null)
      if [ -z "$raw" ] || [ "$raw" = "null" ]; then
        echo '[]'
        exit 0
      fi
      # 步骤 2: 解析成 "file:line:content" 列表
      candidates=$(echo "$raw" | jq -r '
        [.. | objects | select(has("path")) | select((.severity // "") | IN("critical","important","high"))]
        | .[] | "\(.path):\(.start_line // 0):\(.content // .message // "ocr finding")"
      ' 2>/dev/null | head -20)
      if [ -z "$candidates" ]; then
        echo '[]'
        exit 0
      fi
      # 步骤 3: 调 ocr 再审一次, prompt 加 "falsifiability gate: 优先推翻下面这些 finding, 输出还能站住脚的"
      surviving=$(ocr review --format json --audience agent 2>/dev/null | jq -r '
        [.. | objects | select(has("path")) | select((.severity // "") | IN("critical","important","high"))]
        | .[] | {id: ("FALSIFY-" + (.category // "falsified") | ascii_upcase), severity: "FAIL",
                path: .path, line: (.start_line // 0),
                message: ("证伪后存活: " + (.content // .message // "") | .[0:200])}
      ' 2>/dev/null)
      if [ -z "$surviving" ]; then
        echo '[]'
      else
        echo "$surviving" | jq -cs '.'
      fi
optional: true
timeout: 600
