# dispatch.yaml — hook dispatcher config
#
# Each hook runs the listed topics in order. Add/remove topics here
# without touching the hook scripts.

pre-commit:
  - workspace
  - code
  - checklist

pre-push:
  - workspace
  - code
  - checklist

merge:
  - github/pull_requests
  - github/reviews
  - cleanup
  - checklist

# 严重级别覆盖（按 rule_id）——每个检查「要不要拦截」在这里改，
# 不改代码。FAIL=硬拦 / WARN=提示 / INFO=仅参考。
severity_overrides:
  CM-01: "FAIL"   # commit 标题非 conventional commit
  CM-02: "FAIL"   # commit 标题含 CJK
  CM-03: "FAIL"   # commit type 与关联 PR type 不一致
