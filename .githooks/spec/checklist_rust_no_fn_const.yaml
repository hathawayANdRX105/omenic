# 泛用: 常量集中放在文件顶部 — 别藏在函数里
# grep 模式, 零 LLM
# 检测: 函数体内出现 const X: ... 声明
# 排除: #[cfg(test)] 内的局部 const 允许
enabled: true
hooks: [pre-commit, pre-push, merge]
fail_severity: WARN
match:
  paths_include: ["**/*.rs"]
  paths_exclude: ["target/", ".wt/"]
mode: grep
harness:
  command: "sh"
  args:
    - "-c"
    - |
      ROOT=$(git rev-parse --show-toplevel)
      matches=$(awk '
        /^#\[cfg\(test\)\]/ { in_test=1 }
        /^fn [a-zA-Z_]/ { if (in_test==0) in_fn=1; brace=0 }
        /{/ { brace++ }
        /}/ { brace--; if (brace==0) { in_fn=0; in_test=0 } }
        in_fn && /const [A-Z_]+:/ { print FILENAME ":" FNR ":" $0 }
      ' "$ROOT"/crates/*/src/**/*.rs "$ROOT"/crates/*/src/*.rs 2>/dev/null | head -20)
      if [ -z "$matches" ]; then
        echo '[]'
      else
        printf '%s' "$matches" | jq -R -s '
          split("\n")
          | map(select(length > 0))
          | map(capture("^(?<path>.+):(?<line>[0-9]+):(?<rest>.*)$"))
          | map({id: "FN-CONST", severity: "WARN", path: .path, line: (.line|tonumber), message: ("函数内 const 拉到模块级: " + .rest)})
        '
      fi
optional: true
timeout: 15
