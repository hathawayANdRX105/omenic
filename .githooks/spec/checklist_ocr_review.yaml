# CK-OCR-REVIEW: ocr AI 语义审查 (L3 LLM 层)
# 工具: ocr (alibaba/open-code-review, 已装)
# 设计: 审查 agent 只给 score + confidence + evidence, 不预设"必修/不必修"
# 调用方 (开发 agent) 读 score 后自行决定阈值.
# 推荐解读:
#   score >= 0.8  -> 必修
#   score 0.5-0.8 -> 看 evidence, 决定
#   score < 0.5   -> 误报嫌疑, 跳过
# confidence < 0.4 整体降信
# 输出 schema (每个 finding):
#   id: OCR-{category}-{tier}  (H=conf>=0.7, M=0.4-0.7, L=<0.4)
#   score: 0-1, ocr 算的关注度
#   confidence: 0-1, ocr 自己把握度
#   category: ocr 分类 (bug/security/...)
#   reason: 简短描述
#   evidence: 修复建议
# 性能: 2-5min (LLM)
# SLA: l3
# Hook: merge
# Gate severity 设为 INFO: 闸门默认不阻断, 让调用方按 score 决策
enabled: true
hooks: [merge]
sla: l3
fail_severity: INFO
match:
  paths_include: ["**/*.rs", "**/*.ts", "**/*.py"]
  paths_exclude: ["target/", ".wt/", "**/tests/**", "**/test_*.rs"]
mode: diff
harness:
  command: "sh"
  args:
    - "-c"
    - |
      exec 2>/tmp/gate-ocr-err.log
      if ! command -v ocr >/dev/null 2>&1; then
        echo '[]'
        exit 0
      fi
      raw=$(ocr review --format json --audience agent 2>/dev/null)
      if [ -z "$raw" ] || [ "$raw" = "null" ]; then
        echo '[]'
        exit 0
      fi
      # 输出 score+confidence schema, 不预设 severity
      echo "$raw" | jq -c '
        [.. | objects
          | select(has("path"))
          | select((.severity // "") != "")
          | . as $f
          | {
              id: (((("OCR-" + ($f.category // "review")) | ascii_upcase) + "-") + (if ($f.confidence // 0) >= 0.7 then "H" elif ($f.confidence // 0) >= 0.4 then "M" else "L" end)),
              category: ($f.category // "review"),
              score: (
                if ($f.severity // "") == "critical" then 0.9
                elif ($f.severity // "") == "important" then 0.7
                elif ($f.severity // "") == "high" then 0.7
                elif ($f.severity // "") == "medium" then 0.5
                elif ($f.severity // "") == "low" then 0.3
                else 0.5
                end
              ),
              confidence: ($f.confidence // 0),
              path: $f.path,
              line: ($f.start_line // $f.line // 0),
              reason: ($f.content // $f.message // "ocr finding"),
              evidence: ($f.suggestion // $f.fix // ""),
              severity: "INFO"
            }]
        | if length == 0 then [] else . end
      ' 2>/dev/null | jq -c '.' || echo '[]'
optional: true
timeout: 600
