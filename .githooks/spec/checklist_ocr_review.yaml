# CK-OCR-REVIEW: ocr AI 语义审查 (L3 LLM 层)
# 工具: ocr (alibaba/open-code-review, 已装)
# 触发: harness 调 ocr review, 解析 findings JSON
# 性能: 2-5min (LLM 调用)
# SLA: l3 (LLM, 按需)
# Hook: merge (重量, token 成本高)
# 注意: mode: file (每个变更文件单独审查) + std diff (harness 接 diff 但 ocr 内部重新读)
#       这里用 diff 模式 — ocr 自己读 diff 输出 findings
enabled: true
hooks: [merge]
sla: l3
fail_severity: WARN
match:
  paths_include: ["**/*.rs", "**/*.ts", "**/*.py"]
  paths_exclude: ["target/", ".wt/", "**/tests/**", "**/test_*.rs"]
mode: diff
harness:
  command: "sh"
  args:
    - "-c"
    - |
      if ! command -v ocr >/dev/null 2>&1; then
        # ocr 不在 — 返回 INFO finding
        printf '%s' '[]'
        exit 0
      fi
      # 调 ocr review (会读 git diff 自动)
      raw=$(ocr review --format json --audience agent 2>/dev/null)
      if [ -z "$raw" ] || [ "$raw" = "null" ]; then
        echo '[]'
        exit 0
      fi
      # 解析 ocr 输出, 只取高置信度 finding
      echo "$raw" | jq -c '
        [.. | objects | select(has("path")) | select((.severity // "") | IN("critical","important","high"))]
        | .[]
        | {
            id: ("OCR-" + (.category // "finding") | ascii_upcase),
            severity: (if (.severity // "") == "critical" then "FAIL" else "WARN" end),
            path: .path,
            line: (.start_line // 0),
            message: ((.content // .message // "ocr finding") | tostring | .[0:200])
          }
      ' 2>/dev/null | jq -cs '.' || echo '[]'
optional: true
timeout: 600
