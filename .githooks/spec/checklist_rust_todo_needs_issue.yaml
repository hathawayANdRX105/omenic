# TODO/FIXME 在注释里必须挂 issue 号. 例: // TODO(#123): ...
# 只扫 // 注释, 避开字符串字面量与规则源码里的 "TODO" 关键字表
enabled: true
hooks: [pre-commit, pre-push, merge]
sla: l1
fail_severity: WARN
match:
  paths_include: ["**/*.rs"]
  paths_exclude: ["target/", ".wt/", "**/tests/**", "**/*_test.rs"]
mode: grep
harness:
  command: "sh"
  args:
    - "-c"
    - |
      ROOT=$(git rev-parse --show-toplevel)
      matches=$(grep -rEn '//.*\b(TODO|FIXME)\b' "$ROOT"/crates "$ROOT"/bin --include='*.rs' 2>/dev/null \
        | grep -v '/tests/' \
        | grep -vE 'TODO\(#|FIXME\(#' \
        | grep -vE 'FORBIDDEN_KEYWORDS|stale_marker|GOOD_SUB_BODY|EAGER_TODO|MID_RUN_TODO' \
        | head -20)
      if [ -z "$matches" ]; then
        echo '[]'
      else
        printf '%s' "$matches" | jq -R -s '
          split("\n") | map(select(length > 0))
          | map(capture("^(?<path>.+):(?<line>[0-9]+):(?<rest>.*)$"))
          | map({id:"TODO-NEEDS-ISSUE", severity:"WARN", path:.path, line:(.line|tonumber),
                 message:("TODO/FIXME 必须关联 issue 号 (例 // TODO(#123):): " + .rest)})'
      fi
optional: true
timeout: 10
