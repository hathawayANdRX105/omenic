[workspace]
members = [
  "bin/cli", "bin/gate", "bin/web",
  "crates/agent/adaptor", "crates/agent/orbit", "crates/agent/tools", "crates/agent/mcp",
  "crates/agent/task", "crates/evidence/spec", "crates/infra/config", "crates/ui/tui",
  "crates/agent/subagent", "crates/infra/memory", "crates/infra/prompts",
  "crates/infra/session", "crates/infra/daemon", "crates/ui/web",
  "crates/composition",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
toml = "0.8"
base64 = "0.22"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
thiserror = "2"
anyhow = "1"
ratatui = "0.30"
crossterm = "0.29"
pulldown-cmark = "0.13"
ctrlc = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
