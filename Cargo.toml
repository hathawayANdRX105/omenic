[package]
name = "omenic"
version = "0.1.0"
edition = "2024"
description = "Task-driven agent orchestrator: agents act as functions following Prompt → Result"
license = "MIT"

[[bin]]
name = "omenic"
path = "src/main.rs"
[[bin]]
name = "oi"
path = "src/main.rs"

[workspace]
members = ["bin/gate", "crates/gate-core"]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
toml = "0.8"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
