[workspace]
members = [
  "bin/cli", "bin/gate", "bin/web",
  "crates/agent/adaptor", "crates/agent/orbit", "crates/agent/tools", "crates/agent/mcp",
  "crates/agent/task", "crates/evidence/spec", "crates/infra/config",
  "crates/agent/subagent", "crates/infra/memory", "crates/infra/prompts",
  "crates/infra/session", "crates/infra/daemon",
  "crates/web/client", "crates/web/state",
  "crates/web/components", "crates/web/page-workspace", "crates/web/page-stats",
  "crates/web/page-config",
  "crates/composition",
  "crates/harness/core", "crates/harness/prompt", "crates/harness/tools",
  "crates/harness/runtime", "crates/harness/plugin",
  "crates/harness/compaction", "crates/harness/instruction",
  "crates/harness/subagent",
  "crates/harness/jobs",
  "crates/harness/terminal",
  "crates/harness/plan-mode", "crates/harness/guard", "crates/harness/skill",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
toml = "0.8"
base64 = "0.22"
tempfile = "3"
ureq = { version = "2", features = ["json"] }
thiserror = "2"
anyhow = "1"
pulldown-cmark = "0.13"
ammonia = "4"
ctrlc = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true